<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatelliteEye | Advanced Image Classification</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header>
            <div class="logo">
                <i class="fas fa-satellite"></i>
                <h1>Satellite<span>Eye</span></h1>
            </div>
            <p class="subtitle">Deep learning powered planet observation classification</p>
        </header>

        <section class="glass-card">
            <div class="upload-section" id="dropZone">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-content">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <h3>Upload Satellite Image</h3>
                    <p>Drag and drop or click to browse</p>
                    <span class="file-hint">Supports JPG, PNG (Max 16MB)</span>
                </div>
            </div>

            <div class="preview-section hidden" id="previewSection">
                <div class="image-wrapper">
                    <img id="imagePreview" src="#" alt="Preview">
                    <button class="remove-btn" id="removeBtn"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="action-bar">
                    <button id="analyzeBtn" class="primary-btn">
                        <span class="btn-text">Analyze Terrain</span>
                        <div class="loader hidden" id="btnLoader"></div>
                    </button>
                </div>
            </div>

            <div class="result-section hidden" id="resultSection">
                <div class="prediction-header">
                    <span class="label">Prediction Result</span>
                    <h2 id="predictionClass">Class Name</h2>
                    <span class="confidence" id="confidenceValue">98.5% Confidence</span>
                </div>

                <div class="probability-bars" id="probabilityBars">
                    <!-- Dynamic bars will be inserted here -->
                </div>
            </div>
        </section>

        <footer>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-val">4</span>
                    <span class="stat-label">Classes</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">CNN</span>
                    <span class="stat-label">Architecture</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">99%</span>
                    <span class="stat-label">Accuracy</span>
                </div>
            </div>
        </footer>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
